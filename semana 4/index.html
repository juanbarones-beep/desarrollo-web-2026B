<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mi sitio web</title>
</head>

<body>
    <form action="registro.php" method="post">

        <p>
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" name="nombre" required minlength="5" maxlength="80">
        </p>

        <p>
            <label for="cedula">Cédula:</label>
            <input type="number" id="cedula" name="cedula" required pattern="[0-9] {6,10}">
        </p>

        <p>
            <label for="correo">Correo:</label>
            <input type="email" id="correo" name="correo">
        </p>

        <p>
            <label for="hectareas">Hectáreas:</label>
            <input type="number" id="hectareas" name="hectareas" min="0.5" max="500" step="0.5" required>
        </p>

        <p>
            <label for="siembra">Siembra:</label>
            <input type="date" id="siembra" name="siembra" min="2026-01-01" max="2026-12-31" required>
        </p>
        <p>
            <label for="cultivo">Cultivo principal</label>
            <select id="cultivo" name="cultivo">
            <option value="">Seleccione un cultivo</option>
            <option value="arroz">Arroz</option>
            <option value="maiz">Palma</option>
        </select>
        </p>

        <p>
            <label for="vereda">Vereda:</label>
            <input list="veredas" id="vereda" name="vereda">
            <datalist id="veredas">
            <option value="Cupiagua">
            <option value="Monterralo">
        </datalist>
        </p>
        <fieldset>
            <legend>Datos del producto</legend>

            <p>
                <label for="obs">Observaciones</label>
                <textarea id="obs" name="obs" rows="4" maxlength="300"></textarea>
            </p>

            <p>
                <input type="checkbox" id="datos" name="datos" required>
                <label for="datos">Autorizo el tratamiento de mis datos personales</label>
            </p>
        </fieldset>

        <p>
            <input type="submit" value="enviar">
        </p>
    </form>
</body>

</html>
