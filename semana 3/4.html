<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hato  la aurora - yopal</title>
    <link rel="stylesheet" href="estilo.css">
</head>

<body>
    <form id="pesaje" novalidate>
        <fieldset>
            <legend>Pesaje de novillo</legend>

            <label for="chapeta">Chapeta ICA</label>
            <input id="chapeta" name="chapeta" type="text"
                pattern="C[0-9]{9}" required
                placeholder="C085001234">

            <label for="peso">Peso (kg)</label>
            <input id="peso" name="peso" type="number"
                min="120" max="700" step="0.5" required>

            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required>

            <label for="lote">Lote</label>
            <select id="lote" name="lote" required>
                <option value="">Seleccione...</option>
                <option value="ceba-a">Ceba A - Palmar</option>
                <option value="ceba-b">Ceba B - Marichal</option>
            </select>

            <button type="submit">Guardar pesaje</button>
        </fieldset>
    </form>
</body>

</html>
